# ==========================
# Application Configuration
# ==========================
spring.application.name=self-checkin-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ==========================
# PostgreSQL Database
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/self_checkin_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# Hibernate (JPA)
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Server
# ==========================
server.port=${PORT:8080}

# ==========================
# AWS Configuration
# ==========================
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:eu-north-1}
aws.bucket-name=${AWS_BUCKET_NAME:selfcheckin-storage}

# ==========================
# Email Configuration
# ==========================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# Security / JWT
# ==========================
app.jwt.secret=${JWT_SECRET:}