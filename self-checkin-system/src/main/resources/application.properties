# ==========================
# Application Configuration
# ==========================
spring.application.name=self-checkin-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ==========================
# PostgreSQL Database (Supabase)
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.kesemylylkjxcygzirpl.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# Hibernate (JPA)
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Server
# ==========================
server.port=${PORT:8080}

# ==========================
# AWS Configuration
# ==========================
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:eu-north-1}
aws.bucket-name=${AWS_BUCKET_NAME:selfcheckin-storage}

# ==========================
# Email Configuration
# ==========================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:gmj.creation.77@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:ducqrdwihghgnavq}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# ==========================
# Security / JWT & App URLs
# ==========================
app.jwt.secret=${JWT_SECRET:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}