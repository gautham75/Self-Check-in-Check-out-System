# ===================================================================
# EventSync Production Profile Configuration (application-prod.properties)
# ===================================================================
spring.application.name=self-checkin-system

# ==========================
# Server & HTTP Performance
# ==========================
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# ==========================
# Production PostgreSQL Database (Supabase)
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.kesemylylkjxcygzirpl.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ==========================
# Hibernate JPA (Production)
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================
# AWS S3 Storage Integration
# ==========================
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:eu-north-1}
aws.bucket-name=${AWS_BUCKET_NAME:selfcheckin-storage}

# ==========================
# Email Configuration (SMTP)
# ==========================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ==========================
# JWT Security & App URLs
# ==========================
app.jwt.secret=${JWT_SECRET:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}

# ==========================
# Logging
# ==========================
logging.level.root=INFO
logging.level.com.gautham.selfcheckinsystem=INFO
logging.level.org.springframework.web=INFO
logging.level.org.apache.catalina=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.springframework.security=WARN
