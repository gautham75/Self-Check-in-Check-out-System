<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <!-- White Background -->
  <rect width="900" height="240" rx="16" fill="#FFFFFF" />

  <g transform="translate(20, 20) scale(0.39)">
    <!-- Onyx Dark Shield Background (#212227) -->
    <path d="M256 36 C348 36 432 72 432 176 C432 316 256 460 256 476 C256 460 80 316 80 176 C80 72 164 36 256 36 Z" fill="#212227" />

    <!-- Warm Gold Ticket Header Accent Bar (#FFD036) -->
    <rect x="156" y="108" width="200" height="28" rx="8" fill="#FFD036" opacity="0.85" />
    <circle cx="190" cy="98" r="7" fill="#FFFFFF" opacity="0.8" />
    <circle cx="322" cy="98" r="7" fill="#FFFFFF" opacity="0.8" />

    <!-- QR Code Matrix Elements -->
    <rect x="148" y="156" width="60" height="60" rx="12" fill="#FFFFFF" />
    <rect x="164" y="172" width="28" height="28" rx="5" fill="#212227" />

    <rect x="304" y="156" width="60" height="60" rx="12" fill="#FFFFFF" />
    <rect x="320" y="172" width="28" height="28" rx="5" fill="#212227" />

    <rect x="148" y="272" width="60" height="60" rx="12" fill="#FFFFFF" />
    <rect x="164" y="288" width="28" height="28" rx="5" fill="#212227" />

    <rect x="228" y="156" width="24" height="24" rx="5" fill="#FFD036" opacity="0.95" />
    <rect x="260" y="188" width="24" height="24" rx="5" fill="#FFFFFF" opacity="0.9" />
    <rect x="228" y="220" width="24" height="24" rx="5" fill="#FFFFFF" opacity="0.9" />
    <rect x="260" y="252" width="24" height="24" rx="5" fill="#FFD036" opacity="0.95" />

    <!-- Ticket Side Cutout Notches -->
    <circle cx="80" cy="244" r="22" fill="#FFD036" opacity="0.25" />
    <circle cx="432" cy="244" r="22" fill="#FFD036" opacity="0.25" />

    <!-- Overlapping Warm Gold Checkmark Badge (#FFD036) -->
    <circle cx="328" cy="328" r="84" fill="#FFD036" />
    <circle cx="328" cy="328" r="84" fill="none" stroke="#212227" stroke-width="6" opacity="0.15" />
    <path d="M288 328 L316 356 L368 298" fill="none" stroke="#212227" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography: EventSync -->
  <text x="240" y="132" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="82" letter-spacing="-1.5">
    <tspan fill="#212227">Event</tspan>
    <tspan fill="#E5AB00">Sync</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="242" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="20" fill="#6E7079" letter-spacing="4">
    ENTERPRISE CHECK-IN PLATFORM
  </text>
</svg>
